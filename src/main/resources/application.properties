spring.application.name=northstar-market
server.port=${SERVER_PORT:8080}
management.endpoints.web.exposure.include=health
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.fail-on-null-for-primitives=true
springdoc.api-docs.version=OPENAPI_3_1
spring.datasource.url=${NORTHSTAR_DB_URL:jdbc:postgresql://localhost:5432/northstar_market}
spring.datasource.username=${NORTHSTAR_DB_USERNAME:northstar_app}
spring.datasource.password=${NORTHSTAR_DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${NORTHSTAR_DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.connection-timeout=${NORTHSTAR_DB_CONNECTION_TIMEOUT_MS:5000}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=northstar
spring.jpa.show-sql=${NORTHSTAR_SHOW_SQL:false}
spring.flyway.url=${NORTHSTAR_MIGRATION_DB_URL:jdbc:postgresql://localhost:5432/northstar_market}
spring.flyway.user=${NORTHSTAR_MIGRATION_DB_USERNAME:northstar_migrator}
spring.flyway.password=${NORTHSTAR_MIGRATION_DB_PASSWORD}
spring.flyway.default-schema=northstar
spring.flyway.schemas=northstar
spring.flyway.locations=classpath:db/migration
